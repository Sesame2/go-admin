basePath: /api
definitions:
  dto.CreateUserInput:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  ent.User:
    properties:
      email:
        description: Email holds the value of the "email" field.
        type: string
      id:
        description: |-
          ID of the ent.
          用户 UUID
        type: string
      password:
        description: Password holds the value of the "password" field.
        type: string
      username:
        description: Username holds the value of the "username" field.
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 用于用户增删改查的 RESTful API
  title: 用户管理系统 API
  version: "1.0"
paths:
  /users:
    get:
      consumes:
      - application/json
      description: 获取单个用户的信息
      produces:
      - application/json
      responses: {}
      summary: 获取用户信息
      tags:
      - 用户模块
    post:
      consumes:
      - application/json
      description: 接收用户信息并创建用户记录
      parameters:
      - description: 用户信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，返回用户信息
          schema:
            $ref: '#/definitions/ent.User'
      summary: 创建新用户
      tags:
      - 用户模块
swagger: "2.0"
