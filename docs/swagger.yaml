basePath: /api
definitions:
  dto.CreateKnowledgeBaseInput:
    properties:
      description:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateUserInput:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      role:
        enum:
        - admin
        - user
        - guest
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - role
    - username
    type: object
  dto.DocumentListResult:
    properties:
      documents:
        items:
          $ref: '#/definitions/models.Document'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  dto.KnowledgeBaseListResult:
    properties:
      current_page:
        type: integer
      page_size:
        type: integer
      result:
        items:
          $ref: '#/definitions/models.KnowledgeBase'
        type: array
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.LoginInput:
    properties:
      password:
        example: test123
        minLength: 6
        type: string
      username:
        example: test
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.ParseDocumentInput:
    properties:
      document_id:
        type: string
    required:
    - document_id
    type: object
  dto.UpdateDocumentInput:
    properties:
      atom_question_count:
        type: integer
      chunk_count:
        type: integer
      error_message:
        type: string
      status:
        type: string
    type: object
  dto.UpdateKnowledgeBaseInput:
    properties:
      description:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  dto.UpdateUserInput:
    properties:
      email:
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
  models.Document:
    properties:
      atom_question_count:
        description: 原子问题数量
        type: integer
      chunk_count:
        description: 处理结果统计
        type: integer
      created_at:
        description: 时间戳
        type: string
      error_message:
        description: 错误信息
        type: string
      file_size:
        description: 文件大小（字节）
        type: integer
      file_type:
        description: pdf, docx, pptx, markdown
        type: string
      filename:
        description: 文档基本信息
        type: string
      id:
        type: string
      knowledge_base:
        $ref: '#/definitions/models.KnowledgeBase'
      knowledge_base_id:
        type: string
      meta_data:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: 元数据（自定义扩展字段）
      minio_path:
        description: MinIO 存储路径
        type: string
      owner:
        allOf:
        - $ref: '#/definitions/models.User'
        description: 关联
      processed_at:
        description: 处理完成时间
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.DocumentStatus'
        description: 处理状态 - 使用 PostgreSQL ENUM 类型（与 Python 模型保持一致）
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.DocumentStatus:
    enum:
    - pending
    - downloading
    - parsing
    - chunking
    - tagging
    - embedding
    - completed
    - failed
    type: string
    x-enum-comments:
      DocumentStatusChunking: 分片中
      DocumentStatusCompleted: 处理完成
      DocumentStatusDownloading: 下载中
      DocumentStatusEmbedding: 向量化中
      DocumentStatusFailed: 处理失败
      DocumentStatusParsing: 解析中
      DocumentStatusPending: 待处理
      DocumentStatusTagging: 原子问题生成中
    x-enum-varnames:
    - DocumentStatusPending
    - DocumentStatusDownloading
    - DocumentStatusParsing
    - DocumentStatusChunking
    - DocumentStatusTagging
    - DocumentStatusEmbedding
    - DocumentStatusCompleted
    - DocumentStatusFailed
  models.JSONMap:
    additionalProperties: true
    type: object
  models.KnowledgeBase:
    properties:
      created_at:
        type: string
      description:
        type: string
      doc_num:
        type: integer
      document_count:
        type: integer
      id:
        type: string
      name:
        type: string
      tags:
        $ref: '#/definitions/models.JSONMap'
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: 关联
      user_id:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      documents:
        description: 关联
        items:
          $ref: '#/definitions/models.Document'
        type: array
      email:
        type: string
      id:
        type: string
      nickname:
        type: string
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 用于用户增删改查的 RESTful API
  title: 用户管理系统 API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 验证用户凭据并返回JWT令牌
      parameters:
      - description: 登录凭据
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dto.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功返回令牌
          schema:
            properties:
              token:
                type: string
            type: object
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: 认证失败
          schema:
            properties:
              error:
                type: string
            type: object
      summary: 用户登录
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 刷新JWT令牌以延长会话
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功返回新令牌
          schema:
            properties:
              token:
                type: string
            type: object
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: 令牌无效或过期
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 刷新令牌
      tags:
      - 认证
  /documents:
    get:
      consumes:
      - application/json
      description: 分页获取指定知识库下的所有文档
      parameters:
      - description: 知识库ID
        in: query
        name: knowledge_base_id
        required: true
        type: string
      - description: 页码，默认为1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认为10
        in: query
        name: page_size
        type: integer
      - description: 文档状态筛选
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 文档列表
          schema:
            $ref: '#/definitions/dto.DocumentListResult'
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 获取知识库下所有文档
      tags:
      - 文档模块
  /documents/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定ID的文档
      parameters:
      - description: 文档ID (UUID格式)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            properties:
              message:
                type: string
            type: object
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 文档不存在
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 删除文档
      tags:
      - 文档模块
    get:
      consumes:
      - application/json
      description: 根据ID获取文档的详细信息
      parameters:
      - description: 文档ID (UUID格式)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 文档详情
          schema:
            $ref: '#/definitions/models.Document'
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 文档不存在
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 获取文档详情
      tags:
      - 文档模块
    put:
      consumes:
      - application/json
      description: 更新文档信息
      parameters:
      - description: 文档ID (UUID格式)
        in: path
        name: id
        required: true
        type: string
      - description: 更新输入
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateDocumentInput'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的文档
          schema:
            $ref: '#/definitions/models.Document'
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 文档不存在
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 更新文档
      tags:
      - 文档模块
  /documents/{id}/download:
    get:
      consumes:
      - application/json
      description: 获取文档的预签名下载URL
      parameters:
      - description: 文档ID (UUID格式)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 下载URL
          schema:
            properties:
              url:
                type: string
            type: object
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 获取文档下载URL
      tags:
      - 文档模块
  /documents/parse:
    post:
      consumes:
      - application/json
      description: 触发文档解析任务（异步处理）
      parameters:
      - description: 解析请求
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.ParseDocumentInput'
      produces:
      - application/json
      responses:
        "200":
          description: 解析任务已提交
          schema:
            properties:
              message:
                type: string
            type: object
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 解析文档
      tags:
      - 文档模块
  /documents/upload:
    post:
      consumes:
      - multipart/form-data
      description: 上传文档到指定知识库
      parameters:
      - description: 知识库ID
        in: formData
        name: knowledge_base_id
        required: true
        type: string
      - description: 要上传的文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功的文档信息
          schema:
            $ref: '#/definitions/models.Document'
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 上传文档
      tags:
      - 文档模块
  /knowledge_bases:
    get:
      consumes:
      - application/json
      description: 分页获取知识库列表
      parameters:
      - description: 页码，默认为1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认为10
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 知识库列表
          schema:
            $ref: '#/definitions/dto.KnowledgeBaseListResult'
        "400":
          description: 参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            properties:
              error:
                type: string
            type: object
      summary: 获取所有知识库
      tags:
      - 知识库模块
    post:
      consumes:
      - application/json
      description: 创建一个新的知识库
      parameters:
      - description: 知识库创建输入
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateKnowledgeBaseInput'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功的知识库信息
          schema:
            $ref: '#/definitions/models.KnowledgeBase'
        "400":
          description: 请求参数错误
          schema:
            properties:
              ' details':
                type: string
              error:
                type: string
            type: object
        "500":
          description: 系统内部错误
          schema:
            properties:
              ' detail':
                type: string
              error:
                type: string
            type: object
      summary: 创建知识库
      tags:
      - 知识库模块
  /knowledge_bases/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定ID的知识库
      parameters:
      - description: 知识库ID (UUID格式)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            properties:
              message:
                type: string
            type: object
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 知识库不存在
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            properties:
              error:
                type: string
            type: object
      summary: 删除知识库
      tags:
      - 知识库模块
    get:
      consumes:
      - application/json
      description: 根据ID获取知识库的详细信息
      parameters:
      - description: 知识库ID (UUID格式)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 知识库详情
          schema:
            $ref: '#/definitions/models.KnowledgeBase'
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 知识库不存在
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            properties:
              error:
                type: string
            type: object
      summary: 获取知识库详情
      tags:
      - 知识库模块
    put:
      consumes:
      - application/json
      description: 更新知识库信息
      parameters:
      - description: 知识库ID (UUID格式)
        in: path
        name: id
        required: true
        type: string
      - description: 更新输入
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateKnowledgeBaseInput'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的知识库
          schema:
            $ref: '#/definitions/models.KnowledgeBase'
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 知识库不存在
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            properties:
              error:
                type: string
            type: object
      summary: 更新知识库
      tags:
      - 知识库模块
  /retrieval/stream:
    get:
      consumes:
      - application/json
      description: 通过SSE流式返回检索和问答结果
      parameters:
      - description: 用户问题
        in: query
        name: question
        required: true
        type: string
      - description: 知识库ID
        in: query
        name: knowledge_base_id
        required: true
        type: string
      - description: 最大迭代次数，默认5
        in: query
        name: max_iterations
        type: integer
      - description: 是否流式输出答案，默认true
        in: query
        name: stream_answer
        type: boolean
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE事件流
          schema:
            type: string
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 流式检索问答
      tags:
      - 检索模块
  /users:
    get:
      consumes:
      - application/json
      description: 获取系统中所有用户的列表
      produces:
      - application/json
      responses:
        "200":
          description: 返回用户列表
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/models.User'
                type: array
            type: object
      security:
      - Bearer: []
      summary: 获取所有用户
      tags:
      - 用户模块
    post:
      consumes:
      - application/json
      description: 接收用户信息并创建用户记录
      parameters:
      - description: 用户信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，返回用户信息
          schema:
            $ref: '#/definitions/models.User'
      security:
      - Bearer: []
      summary: 创建新用户
      tags:
      - 用户模块
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定ID的用户
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 删除用户
      tags:
      - 用户模块
    get:
      consumes:
      - application/json
      description: 根据用户ID获取特定用户的详细信息
      parameters:
      - description: 用户ID (UUID格式)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 用户详细信息
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 用户不存在
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 获取单个用户信息
      tags:
      - 用户模块
    put:
      consumes:
      - application/json
      description: 更新用户的各种信息，支持部分字段更新
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: string
      - description: 用户更新信息
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      security:
      - Bearer: []
      summary: 更新用户信息
      tags:
      - 用户模块
securityDefinitions:
  Bearer:
    description: '请输入 ''Bearer '' + JWT 令牌，例如: "Bearer abcde12345"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
