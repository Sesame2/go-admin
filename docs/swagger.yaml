basePath: /api
definitions:
  dto.CreateKnowledgeBaseInput:
    properties:
      dataset_id:
        type: string
      knowledgebase_name:
        type: string
    type: object
  dto.CreateUserInput:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      role:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - role
    - username
    type: object
  dto.KnowledgeBaseListResult:
    properties:
      current_page:
        type: integer
      page_size:
        type: integer
      result:
        items:
          $ref: '#/definitions/ent.KnowledgeBase'
        type: array
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.LoginInput:
    properties:
      password:
        example: test123
        minLength: 6
        type: string
      username:
        example: test
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.UpdateUserInput:
    properties:
      email:
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
  ent.KnowledgeBase:
    properties:
      created_at:
        description: 创建时间
        type: string
      dataset_id:
        description: 关丽娜的数据库ID
        type: string
      id:
        description: |-
          ID of the ent.
          数据库ID
        type: string
      name:
        description: 知识库名称
        type: string
      updated_at:
        description: 更改时间
        type: string
    type: object
  ent.User:
    properties:
      email:
        description: Email holds the value of the "email" field.
        type: string
      id:
        description: |-
          ID of the ent.
          用户 UUID
        type: string
      password:
        description: Password holds the value of the "password" field.
        type: string
      role:
        description: 用户角色
        type: string
      username:
        description: Username holds the value of the "username" field.
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 用于用户增删改查的 RESTful API
  title: 用户管理系统 API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 验证用户凭据并返回JWT令牌
      parameters:
      - description: 登录凭据
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dto.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功返回令牌
          schema:
            properties:
              token:
                type: string
            type: object
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: 认证失败
          schema:
            properties:
              error:
                type: string
            type: object
      summary: 用户登录
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 刷新JWT令牌以延长会话
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功返回新令牌
          schema:
            properties:
              token:
                type: string
            type: object
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: 令牌无效或过期
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 刷新令牌
      tags:
      - 认证
  /knowledge_bases:
    get:
      consumes:
      - application/json
      description: 分页获取知识库列表
      parameters:
      - description: 页码，默认为1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认为10
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 知识库列表
          schema:
            $ref: '#/definitions/dto.KnowledgeBaseListResult'
        "400":
          description: 参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            properties:
              error:
                type: string
            type: object
      summary: 获取所有知识库
      tags:
      - 知识库模块
    post:
      consumes:
      - application/json
      description: 创建一个新的知识库
      parameters:
      - description: 知识库创建输入
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateKnowledgeBaseInput'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功的知识库信息
          schema:
            $ref: '#/definitions/ent.KnowledgeBase'
        "400":
          description: 请求参数错误
          schema:
            properties:
              ' details':
                type: string
              error:
                type: string
            type: object
        "500":
          description: 系统内部错误
          schema:
            properties:
              ' detail':
                type: string
              error:
                type: string
            type: object
      summary: 创建知识库
      tags:
      - 知识库模块
  /knowledge_bases/{id}:
    get:
      consumes:
      - application/json
      description: 根据ID获取知识库的详细信息
      parameters:
      - description: 知识库ID (UUID格式)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 知识库详情
          schema:
            $ref: '#/definitions/ent.KnowledgeBase'
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 知识库不存在
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            properties:
              error:
                type: string
            type: object
      summary: 获取知识库详情
      tags:
      - 知识库模块
  /users:
    get:
      consumes:
      - application/json
      description: 获取系统中所有用户的列表
      produces:
      - application/json
      responses:
        "200":
          description: 返回用户列表
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/ent.User'
                type: array
            type: object
      security:
      - Bearer: []
      summary: 获取所有用户
      tags:
      - 用户模块
    post:
      consumes:
      - application/json
      description: 接收用户信息并创建用户记录
      parameters:
      - description: 用户信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，返回用户信息
          schema:
            $ref: '#/definitions/ent.User'
      security:
      - Bearer: []
      summary: 创建新用户
      tags:
      - 用户模块
  /users/{id}:
    get:
      consumes:
      - application/json
      description: 根据用户ID获取特定用户的详细信息
      parameters:
      - description: 用户ID (UUID格式)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 用户详细信息
          schema:
            $ref: '#/definitions/ent.User'
        "400":
          description: 请求参数错误
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 用户不存在
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - Bearer: []
      summary: 获取单个用户信息
      tags:
      - 用户模块
    put:
      consumes:
      - application/json
      description: 更新用户的各种信息，支持部分字段更新
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: string
      - description: 用户更新信息
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ent.User'
      security:
      - Bearer: []
      summary: 更新用户信息
      tags:
      - 用户模块
securityDefinitions:
  Bearer:
    description: '请输入 ''Bearer '' + JWT 令牌，例如: "Bearer abcde12345"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
