version: "3.8"

services:
  postgres:
    image: postgres:14-alpine
    container_name: go-admin-postgres
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=go_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - go-admin-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: go-admin-pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - go-admin-network

  kb-minio:
    image: quay.io/minio/minio:RELEASE.2024-04-06T05-26-02Z
    container_name: go-admin-minio
    restart: always
    ports:
      - "9000:9000" # MinIO主服务端口映射
      - "9001:9001" # MinIO控制台端口映射
    environment:
      - MINIO_ACCESS_KEY=root
      - MINIO_SECRET_KEY=123456789
      - TZ=Asia/Shanghai
    command: server --console-address ":9001" --address ":9000" /data
    volumes:
      - ./env_data/minio/data:/data
      - ./env_data/minio/config:/root/.minio
    networks:
      - go-admin-network

volumes:
  postgres_data:

networks:
  go-admin-network:
    driver: bridge
