version: "3.8"

services:
  postgres:
    image: postgres:14-alpine
    container_name: go-admin-postgres
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=go_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - go-admin-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: go-admin-pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - go-admin-network

volumes:
  postgres_data:

networks:
  go-admin-network:
    driver: bridge
